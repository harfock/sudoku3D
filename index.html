<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>星際 3D 魔方數獨 (Cosmic 3D Cube Sudoku)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap');
    
    body {
      font-family: 'Noto Sans TC', 'Orbitron', sans-serif;
      overflow: hidden;
      touch-action: none;
      background: #030712;
    }
    canvas {
      display: block;
      touch-action: none;
      user-select: none;
    }

    .cosmic-plate {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 27, 75, 0.88));
      border: 2px solid rgba(168, 85, 247, 0.5);
      box-shadow: 0 0 25px rgba(147, 51, 234, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      border-radius: 1.5rem;
    }

    .cosmic-btn {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      font-weight: 900;
      border-radius: 9999px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -3px 5px rgba(0,0,0,0.7);
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .cosmic-btn:active {
      transform: translateY(3px) scale(0.94);
      box-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .truck-container {
      position: relative;
      background: radial-gradient(circle at right, rgba(88, 28, 135, 0.6) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 2px solid #a855f7;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
      border-radius: 1.5rem;
      overflow: hidden;
    }

    .truck-cabin {
      position: absolute;
      right: 8px;
      bottom: 8px;
      top: 8px;
      width: 54px;
      background: linear-gradient(145deg, #7e22ce, #3b0764);
      border: 2px solid #f0abfc;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(240, 171, 252, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @keyframes rollDownRamp {
      0% { transform: translateX(40px) rotate(180deg) scale(0.6); opacity: 0; }
      100% { transform: translateX(0px) rotate(0deg) scale(1); opacity: 1; }
    }

    .rolling-crate {
      animation: rollDownRamp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .crate-ammo {
      min-width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(145deg, #1e1b4b, #0f172a);
      border: 2px solid #a855f7;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.3), inset 0 1px 2px rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      color: #e9d5ff;
      transition: all 0.2s ease;
      touch-action: manipulation;
      flex-shrink: 0;
    }
    .crate-ammo:active {
      transform: scale(0.92);
    }

    @keyframes popIn {
      0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
      70% { transform: scale(1.08) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>

    class CosmicSoundFX {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      playSelect() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.08);
      }
      playPlace() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
      }
      playClang() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.setValueAtTime(180, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
      }
      playSuccess() {
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, i) => {
          const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(f, this.ctx.currentTime + i * 0.05);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.05 + 0.3);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + i * 0.05);
          osc.stop(this.ctx.currentTime + i * 0.05 + 0.3);
        });
      }
    }

    class CosmicCubeSudokuDirectApp {
      constructor() {
        this.gridSize = 3;
        this.lang = 'zh';
        this.assistantMode = true;

        this.clearCount = parseInt(localStorage.getItem('cosmic_cube_clears') || '0', 10);
        const clearElem = document.getElementById('score-clear');
        if (clearElem) clearElem.innerText = this.clearCount;

        this.sound = new CosmicSoundFX();
        this.selectedTile = null;

        this.cubeNodes = [];
        this.textureCache = {};

        this.playSeconds = 0;
        this.timerInterval = null;

        this.isDragging = false;
        this.hasMoved = false;
        this.dragStart = { x: 0, y: 0 };
        this.lastTouchDist = 0;
        
        this.rotVelocity = { x: 0, y: 0 };

        this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();

        this.setupThreeJS();
        this.initControls();

      setupThreeJS() {
        const container = document.getElementById('canvas-container');
        this.scene = new THREE.Scene();
        this.scene.fog = new THREE.FogExp2(0x030712, 0.012);

        this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.cameraDistance = 28;
        this.updateCameraPos();

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;

        this.scene.add(new THREE.AmbientLight(0xffffff, 0.85));

      updateCameraPos() {
        this.camera.position.set(0, 8, this.cameraDistance);
        this.camera.lookAt(0, 0, 0);
      }

      buildStarfield() {
        const count = 1200;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count * 3; i += 3) {
          positions[i] = (Math.random() - 0.5) * 220;
          positions[i+1] = (Math.random() - 0.5) * 220;
          positions[i+2] = (Math.random() - 0.5) * 220;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({ color: 0xe9d5ff, size: 0.7, transparent: true, opacity: 0.8 });
        this.scene.add(new THREE.Points(geo, mat));
      }

      buildPlanets() {
        const planetGeo = new THREE.SphereGeometry(8, 32, 32);
        const planetMat = new THREE.MeshStandardMaterial({ color: 0x4c1d95, roughness: 0.8 });
        const gasGiant = new THREE.Mesh(planetGeo, planetMat);
        gasGiant.position.set(45, -20, -40);
        this.scene.add(gasGiant);
      }

      getMultiFaceTexture(val, isGiven, isSelected = false, isError = false) {
        const key = `${val}_${isGiven}_${isSelected}_${isError}_${this.gridSize}`;
        if (this.textureCache[key]) return this.textureCache[key];

        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');

        if (isError) {
          ctx.fillStyle = '#881337';
        } else if (isSelected) {
          ctx.fillStyle = '#7e22ce';
        } else {
          ctx.fillStyle = isGiven ? '#312e81' : '#0f172a';
        }
        ctx.fillRect(0, 0, 256, 256);

        ctx.strokeStyle = isError ? '#fda4af' : isSelected ? '#f0abfc' : isGiven ? '#f59e0b' : '#c084fc';
        ctx.lineWidth = isSelected || isError ? 24 : 16;
        ctx.strokeRect(10, 10, 236, 236);

        if (val > 0) {
          ctx.font = '900 130px system-ui, sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillStyle = isError ? '#ffe4e6' : isGiven ? '#fbbf24' : '#ffffff';
          ctx.fillText(val.toString(), 128, 134);
        }

        const texture = new THREE.CanvasTexture(canvas);
        this.textureCache[key] = texture;
        return texture;
      }

      createBlockMesh(val, isGiven, isSelected = false, isError = false) {
        const blockSize = 11.5 / (this.gridSize * 1.25);
        const geo = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
        const texture = this.getMultiFaceTexture(val, isGiven, isSelected, isError);

        const faceMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.3 });
        const materials = [faceMat, faceMat, faceMat, faceMat, faceMat, faceMat];
        const mesh = new THREE.Mesh(geo, materials);
        mesh.castShadow = true; mesh.receiveShadow = true;
        return mesh;
      }

      updateBlockMeshTexture(node) {
        const isSelected = (node === this.selectedTile);
        const texture = this.getMultiFaceTexture(node.val, node.isGiven, isSelected, node.isError);
        for (let i = 0; i < 6; i++) {
          node.mesh.material[i].map = texture;
          node.mesh.material[i].needsUpdate = true;
        }

        if (isSelected) {
          node.mesh.scale.set(1.15, 1.15, 1.15);
        } else {
          node.mesh.scale.set(1.0, 1.0, 1.0);
        }
      }

      selectGridSize(size) {
        this.gridSize = size;
        [3, 5, 9].forEach(s => {
          const btn = document.getElementById(`grid-${s}`);

          }

      toggleAssistant() {

      startTimer() {

      updateBestTimeDisplay() {
        const bestKey = `cosmic_best_time_${this.gridSize}`;

      startGame() {
        document.getElementById('title-screen').style.display = 'none';
        this.cubeGroup.rotation.y = 0;
        this.cubeGroup.rotation.x = 0;
        this.rotVelocity = { x: 0, y: 0 };
        this.selectedTile = null;

        this.buildValidSudokuCubeLevel();
        this.renderTruckCargoBed();
        this.updateProgressDisplay();
        this.updateBestTimeDisplay();
        this.startTimer();

        if (!this.loopRunning) {
          this.loopRunning = true;

        }
      }

      returnToTitle() {
        this.stopTimer();
        document.getElementById('title-screen').style.display = 'flex';
        document.getElementById('victory-overlay').classList.add('hidden');
      }

      nextLevel() {
        document.getElementById('victory-overlay').classList.add('hidden');
        this.clearCount++;
        localStorage.setItem('cosmic_cube_clears', this.clearCount.toString());
        const clearElem = document.getElementById('score-clear');
        if (clearElem) clearElem.innerText = this.clearCount;
        this.startGame();
      }

      generateLatinSquare(N) {
        const grid = Array.from({ length: N }, () => Array(N).fill(0));
        
        if (N === 3) {
          const shift = Math.floor(Math.random() * 2) + 1;
          for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
              grid[r][c] = ((r * shift + c) % 3) + 1;
            }
          }
        } else if (N === 5) {
          const shift = Math.floor(Math.random() * 3) + 2;
          for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
              grid[r][c] = ((r * shift + c) % 5) + 1;
            }
          }
        } else if (N === 9) {
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              grid[r][c] = ((Math.floor(r / 3) + (r % 3) * 3 + c) % 9) + 1;
            }
          }
        }

        const symbols = Array.from({ length: N }, (_, i) => i + 1).sort(() => Math.random() - 0.5);
        for (let r = 0; r < N; r++) {
          for (let c = 0; c < N; c++) {
            grid[r][c] = symbols[grid[r][c] - 1];
          }
        }

        return grid;
      }

      buildValidSudokuCubeLevel() {
        while (this.cubeGroup.children.length > 0) {
          this.cubeGroup.remove(this.cubeGroup.children[0]);
        }
        this.cubeNodes = [];

        const N = this.gridSize;
        const spacing = 12 / N;
        const offset = 6;
        const givenRatio = N === 3 ? 0.45 : N === 5 ? 0.35 : 0.25;

        const faces = [
          { faceIdx: 0, rot: [0, 0, 0] },
          { faceIdx: 1, rot: [0, Math.PI, 0] },
          { faceIdx: 2, rot: [0, Math.PI / 2, 0] },
          { faceIdx: 3, rot: [0, -Math.PI / 2, 0] },
          { faceIdx: 4, rot: [-Math.PI / 2, 0, 0] },
          { faceIdx: 5, rot: [Math.PI / 2, 0, 0] }
        ];

        faces.forEach(f => {
          const solutionGrid = this.generateLatinSquare(N);

          for (let r = 0; r < N; r++) {
            for (let c = 0; c < N; c++) {
              const solVal = solutionGrid[r][c];
              const isGiven = Math.random() < givenRatio;
              const initVal = isGiven ? solVal : 0;

              const mesh = this.createBlockMesh(initVal, isGiven);

              const lx = (c - (N - 1) / 2) * spacing;
              const ly = ((N - 1) / 2 - r) * spacing;
              const lz = offset;

              const pos = new THREE.Vector3(lx, ly, lz);
              pos.applyEuler(new THREE.Euler(...f.rot));

              mesh.position.copy(pos);
              this.cubeGroup.add(mesh);

              const node = {
                faceIdx: f.faceIdx, r, c,
                val: initVal,
                solutionVal: solVal,
                isGiven,
                isError: false,
                mesh
              };
              mesh.userData = node;
              this.cubeNodes.push(node);
            }
          }
        });
      }

      renderTruckCargoBed() {
        const container = document.getElementById('truck-ramp-crates');
        if (!container) return;
        container.innerHTML = '';
        const maxNum = this.gridSize;

        for (let i = 1; i <= maxNum; i++) {
          const btn = document.createElement('button');
          btn.className = 'crate-ammo rolling-crate';
          btn.innerText = i.toString();
          btn.onclick = () => {
            this.fillSelectedTileWithNumber(i);
          };
          container.appendChild(btn);
        }
      }

      fillSelectedTileWithNumber(num) {
        const t = I18N[this.lang];
        if (!this.selectedTile) {
          this.updateGuidance(t.promptSelect);
          return;
        }

        if (this.selectedTile.isGiven) {
          this.sound.playClang();
          this.updateGuidance(t.promptFixed);
          return;
        }

        // ONLY run duplicate checking and solution checks if Assistant is OPEN!
        if (this.assistantMode) {
          const { faceIdx, r, c } = this.selectedTile;

          let hasConflict = false;
          for (let node of this.cubeNodes) {
            if (node.faceIdx === faceIdx && node !== this.selectedTile) {
              if ((node.r === r || node.c === c) && node.val === num) {
                hasConflict = true;
                break;
              }
            }
          }

          if (hasConflict) {
            this.sound.playClang();
            this.updateGuidance(`${t.promptRowConflict} (${num})!`);
            return;
          }

          if (num !== this.selectedTile.solutionVal) {
            this.sound.playClang();
            this.updateGuidance(t.promptWrongAssist);
            return;
          }
        }

        // Fill number directly (Free mode when Assistant is OFF, or passed Assistant check when ON)
        this.selectedTile.val = num;
        this.selectedTile.isError = false;
        this.updateBlockMeshTexture(this.selectedTile);

        if (num === this.selectedTile.solutionVal) {
          this.sound.playSuccess();
          this.updateGuidance(`${t.promptCorrect} ${num}!`);
        } else {
          this.sound.playPlace();
          this.updateGuidance(t.promptWrongFree);
        }

        this.updateProgressDisplay();
        this.checkVictoryCondition();
      }

      triggerHint() {
        const t = I18N[this.lang];
        const emptyNodes = this.cubeNodes.filter(n => !n.isGiven && n.val !== n.solutionVal);
        
        if (emptyNodes.length === 0) {
          this.updateGuidance('✨ All tiles filled correctly!');
          return;
        }

        const hintNode = emptyNodes[Math.floor(Math.random() * emptyNodes.length)];
        hintNode.val = hintNode.solutionVal;
        hintNode.isError = false;
        
        const prevSelected = this.selectedTile;
        this.selectedTile = hintNode;

        if (prevSelected) this.updateBlockMeshTexture(prevSelected);
        this.updateBlockMeshTexture(hintNode);

        this.sound.playSuccess();
        this.updateProgressDisplay();
        this.updateGuidance(`${t.promptHintUsed} (Face ${hintNode.faceIdx + 1}, Row ${hintNode.r + 1}, Col ${hintNode.c + 1}) = ${hintNode.solutionVal}`);

        this.checkVictoryCondition();
      }

      checkErrors() {
        const t = I18N[this.lang];
        let errorCount = 0;

        this.cubeNodes.forEach(n => {
          if (!n.isGiven && n.val > 0 && n.val !== n.solutionVal) {
            n.isError = true;
            errorCount++;
          } else {
            n.isError = false;
          }
          this.updateBlockMeshTexture(n);
        });

        if (errorCount > 0) {
          this.sound.playClang();
          this.updateGuidance(t.promptCheckErrorsFound);
        } else {
          this.sound.playSuccess();
          this.updateGuidance(t.promptCheckNoErrors);
        }
      }

      clearCurrentTile() {
        if (this.selectedTile && !this.selectedTile.isGiven) {
          this.selectedTile.val = 0;
          this.selectedTile.isError = false;
          this.updateBlockMeshTexture(this.selectedTile);
          this.updateProgressDisplay();
          this.updateGuidance(I18N[this.lang].promptCleared);
        }
      }

      initControls() {
        const dom = this.renderer.domElement;

        const getPos = (e) => {
          const t = e.touches ? e.touches[0] : e;
          return { x: t.clientX, y: t.clientY };
        };

        const getTouchDist = (e) => {
          if (!e.touches || e.touches.length < 2) return 0;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        };

        const onDown = (e) => {
          if (e.target !== dom) return;

          if (e.touches && e.touches.length === 2) {
            this.lastTouchDist = getTouchDist(e);
            return;
          }

          const pos = getPos(e);
          this.isDragging = true;
          this.hasMoved = false;
          this.dragStart = pos;
          this.rotVelocity = { x: 0, y: 0 };
        };

        const onMove = (e) => {
          if (e.touches && e.touches.length === 2) {
            const dist = getTouchDist(e);
            if (this.lastTouchDist > 0) {
              const diff = this.lastTouchDist - dist;
              this.cameraDistance = Math.min(Math.max(16, this.cameraDistance + diff * 0.05), 55);
              this.updateCameraPos();
            }
            this.lastTouchDist = dist;
            return;
          }

          if (!this.isDragging) return;
          const pos = getPos(e);
          const dx = pos.x - this.dragStart.x;
          const dy = pos.y - this.dragStart.y;

          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            this.hasMoved = true;
            this.rotVelocity.y = dx * 0.008;
            this.rotVelocity.x = dy * 0.005;
            this.cubeGroup.rotation.y += this.rotVelocity.y;
            this.cubeGroup.rotation.x += this.rotVelocity.x;
            this.dragStart = pos;
          }
        };

        const onUp = (e) => {
          if (e.target !== dom) {
            this.isDragging = false;
            return;
          }

          if (!this.hasMoved && this.isDragging) {
            this.handleDirectTileTap(e);
          }
          this.isDragging = false;
          this.lastTouchDist = 0;
        };

        const onWheel = (e) => {
          this.cameraDistance = Math.min(Math.max(16, this.cameraDistance + e.deltaY * 0.02), 55);
          this.updateCameraPos();
        };

        dom.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        dom.addEventListener('wheel', onWheel, { passive: true });

        dom.addEventListener('touchstart', onDown, { passive: true });
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onUp);
      }

      handleDirectTileTap(e) {
        const touch = e.changedTouches ? e.changedTouches[0] : e;
        this.mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
        this.mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;

        this.raycaster.setFromCamera(this.mouse, this.camera);
        const intersects = this.raycaster.intersectObjects(this.cubeGroup.children);

        if (intersects.length > 0) {
          const hitMesh = intersects[0].object;
          if (hitMesh.userData) {
            const prevSelected = this.selectedTile;
            this.selectedTile = hitMesh.userData;

            if (prevSelected) this.updateBlockMeshTexture(prevSelected);
            this.updateBlockMeshTexture(this.selectedTile);

            this.sound.playSelect();
            const { faceIdx, r, c, isGiven } = this.selectedTile;
            this.updateGuidance(`Selected (Face ${faceIdx + 1}, Row ${r + 1}, Col ${c + 1}) ${isGiven ? '[Fixed]' : ''}`);
          }
        }
      }

      updateProgressDisplay() {
        const correctCount = this.cubeNodes.filter(n => n.val > 0 && n.val === n.solutionVal).length;
        const total = this.cubeNodes.length;
        const pct = total > 0 ? Math.floor((correctCount / total) * 100) : 0;

        const progContainer = document.getElementById('progress-container');
        const comboEl = document.getElementById('combo-display');

        // Only show progress bar & correct count badge if Assistant is OPEN!
        if (this.assistantMode) {
          if (progContainer) progContainer.style.display = 'inline-flex';
          if (comboEl) comboEl.style.display = 'inline-block';

          const progEl = document.getElementById('score-progress');
          if (progEl) progEl.innerText = `${pct}%`;
          if (comboEl) comboEl.innerText = `${I18N[this.lang].correctCountLabel}: ${correctCount}/${total}`;
        } else {
          if (progContainer) progContainer.style.display = 'none';
          if (comboEl) comboEl.style.display = 'none';
        }
      }

      checkVictoryCondition() {
        if (this.cubeNodes.length > 0 && this.cubeNodes.every(n => n.val === n.solutionVal)) {
          this.stopTimer();
          this.recordBestTime();

          const m = Math.floor(this.playSeconds / 60).toString().padStart(2, '0');
          const s = (this.playSeconds % 60).toString().padStart(2, '0');
          document.getElementById('final-time-display').innerText = `${m}:${s}`;

          // Pick and display one of 12 random praise quotes
          const quotes = PRAISE_QUOTES[this.lang] || PRAISE_QUOTES.zh;
          const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
          const quoteEl = document.getElementById('praise-quote-display');
          if (quoteEl) quoteEl.innerText = randomQuote;

          document.getElementById('victory-overlay').classList.remove('hidden');
        }
      }

      animate() {
        requestAnimationFrame(() => this.animate());

        // Smooth rotation inertia
        if (!this.isDragging) {
          this.cubeGroup.rotation.y += this.rotVelocity.y;
          this.cubeGroup.rotation.x += this.rotVelocity.x;
          this.rotVelocity.y *= 0.92;
          this.rotVelocity.x *= 0.92;
        }

        this.renderer.render(this.scene, this.camera);
      }

      onWindowResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }
    }

    let gameApp;
    window.onload = () => {
      gameApp = new CosmicCubeSudokuDirectApp();
    };
  </script>
</body>
</html>
